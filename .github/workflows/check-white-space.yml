name: Check Whitespace and New Line

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Check trailing space
      # 排除 vendor 代码（thirdparty、spine-c 多版本运行时），其行尾空白不由本仓库负责
      run: if grep -rIn --exclude-dir=thirdparty --exclude-dir=spine-versions "[[:blank:]]$"; then exit 2; else echo OK; fi
    - name: Check no new line at EOF
      run: for f in $(grep -rIl --exclude-dir=thirdparty --exclude-dir=spine-versions ""); do if test $(tail -c 1 $f); then echo $f; fail=1; fi; done; if test $fail; then exit 1; fi

